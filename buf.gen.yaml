---
version: v2
plugins:
  - local: ["./node_modules/.bin/protoc-gen-ts_proto"]
    out: wrappers/proto-npm/src/node
    opt:
      - env=true
      - outputServices=grpc-js
      - useOptionals=messages
      - importSuffix=.js

  # Node Plain (only interfaces, no runtime)
  - local: ["./node_modules/.bin/protoc-gen-ts_proto"]
    out: wrappers/proto-npm/src/node-plain
    opt:
      - outputTypesOnly=true
      - env=node
      - useOptionals=messages
      - forceLong=bigint
      - esModuleInterop=true

  - local: ["./node_modules/.bin/protoc-gen-es"]
    out: wrappers/proto-npm/src/web
    opt:
      - target=ts
      - import_extension=js

  # Web Plain (only interfaces, no runtime)
  - local: ["./node_modules/.bin/protoc-gen-ts_proto"]
    out: wrappers/proto-npm/src/web-plain
    opt:
      - outputTypesOnly=true
      - env=browser
      - useOptionals=messages
      - forceLong=bigint
      - esModuleInterop=true
