syntax = "proto3";

package service.v1;

/// Voice State information for a user
message UserVoiceState {
  string id = 1;
  int64 joined_at = 2;
  bool is_receiving = 3;
  bool is_publishing = 4;
  bool screensharing = 5;
  bool camera = 6;
}

message ChannelVoiceState {
  string id = 1;
  // The states of the users who are connected to the channel
  repeated UserVoiceState participants = 2;
}
