syntax = "proto3";

package service.v1;

import "service/v1/messages.proto";
import "service/v1/messages_db.proto";
import "service/v1/server_members_db.proto";
import "service/v1/users.proto";
import "shared/v1/error.proto";

message SearchUsernamesRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchUsernamesResponse {
  oneof response {
    SearchUsernamesResponseData data = 1;
    shared.v1.AppError error = 2;
  }
}

message SearchUsernamesResponseData {
  repeated SearchUser users = 1;
}

message SearchUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar = 4;
}

message SearchMessageRequest {
  // Full-text search query
  optional string query = 1;

  // Whether to only search for pinned messages, cannot be sent with query
  optional bool pinned = 2;

  // Maximum number of messages to fetch
  optional int64 limit = 3;

  // Message id before which messages should be fetched
  optional string before = 4;

  // Message id after which messages should be fetched
  optional string after = 5;

  // Message sort direction
  // By default, it will be sorted by latest (default: RELEVANCE)
  optional service.v1.MessageSort sort = 6;

  // Whether to include user (and member, if server channel) objects
  optional bool include_users = 7;
}

message SearchMessageResponse {
  oneof response {
    SearchMessageResponseData data = 1;
    shared.v1.AppError error = 2;
  }
}

message SearchMessageResponseData {
  repeated service.v1.Message messages = 1;
  repeated service.v1.APIUser users = 2;
  repeated service.v1.ServerMember members = 3;
}
